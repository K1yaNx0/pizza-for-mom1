```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حاج حسین 🍕</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffffff, #fff0f7);
      color: #333;
      overflow: hidden;
    }

    /* =========================
       صفحه سؤال
    ========================== */

    #questionPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: min(520px, 100%);
      text-align: center;
      background: rgba(255, 255, 255, 0.96);
      border: 2px solid #ffd3e5;
      border-radius: 30px;
      padding: 45px 25px;
      box-shadow: 0 20px 60px rgba(244, 91, 155, 0.18);
    }

    .pizza-icon {
      font-size: 75px;
      margin-bottom: 15px;
      animation: floatPizza 2s ease-in-out infinite;
    }

    @keyframes floatPizza {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(3deg);
      }
    }

    h1 {
      color: #ed4f91;
      font-size: clamp(25px, 6vw, 38px);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #777;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 70px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      touch-action: manipulation;
    }

    #yesBtn {
      background: #f45b9b;
      color: #fff;
      box-shadow: 0 8px 20px rgba(244, 91, 155, 0.25);
    }

    #yesBtn:hover {
      background: #eb4389;
      transform: scale(1.06);
    }

    #noBtn {
      position: absolute;
      right: 15%;
      background: #ffe2ed;
      color: #dc4380;
    }

    /* =========================
       صفحه منو
    ========================== */

    #menuPage {
      display: none;
      min-height: 100vh;
      overflow-y: auto;
      padding: 35px 20px;
    }

    .menu-container {
      width: min(1100px, 100%);
      margin: auto;
      text-align: center;
    }

    .menu-title {
      color: #ed4f91;
      font-size: clamp(28px, 6vw, 42px);
      margin-bottom: 10px;
    }

    .menu-subtitle {
      color: #777;
      margin-bottom: 35px;
    }

    .pizza-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .pizza-card {
      background: #fff;
      border: 2px solid #ffd5e5;
      border-radius: 24px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(255, 105, 160, 0.12);
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .pizza-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 18px 35px rgba(255, 105, 160, 0.2);
    }

    .pizza-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 18px;
    }

    .pizza-name {
      color: #ed4f91;
      font-size: 19px;
      font-weight: bold;
      margin-top: 15px;
    }

    /* =========================
       صفحه نهایی
    ========================== */

    #jokePage {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .joke-card {
      width: min(600px, 100%);
      background: #fff;
      border: 2px solid #ffd3e5;
      border-radius: 30px;
      padding: 50px 25px;
      box-shadow: 0 20px 60px rgba(244, 91, 155, 0.18);
    }

    .joke-emoji {
      font-size: 70px;
      margin-bottom: 20px;
    }

    .joke-card h2 {
      color: #ed4f91;
      font-size: clamp(28px, 7vw, 45px);
      margin-bottom: 15px;
    }

    .joke-card p {
      color: #777;
      font-size: 20px;
      font-weight: bold;
    }

    /* =========================
       ریسپانسیو
    ========================== */

    @media (max-width: 850px) {
      .pizza-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .pizza-grid {
        grid-template-columns: 1fr;
      }

      .pizza-card {
        width: 100%;
        max-width: 350px;
        margin: auto;
      }

      .card {
        padding: 35px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       صفحه سؤال
  ========================== -->

  <section id="questionPage">

    <div class="card">

      <div class="pizza-icon">🍕</div>

      <h1>
        حاج حسین، یک پیتزا مهمونم کن؟ 🥹
      </h1>

      <p class="subtitle">
        فقط یه دونه... قول میدم 😂❤️
      </p>

      <div class="buttons">

        <button id="yesBtn">
          آره 😍
        </button>

        <button id="noBtn">
          نه 😈
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       منوی پیتزا
  ========================== -->

  <section id="menuPage">

    <div class="menu-container">

      <h2 class="menu-title">
        منوی پیتزا 🍕
      </h2>

      <p class="menu-subtitle">
        حالا یکی رو انتخاب کن 😎❤️
      </p>

      <div class="pizza-grid">

        <!-- پپرونی -->
        <div class="pizza-card">
          <img
            src="https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=700&q=80"
            alt="پیتزای پپرونی"
          >

          <div class="pizza-name">
            پیتزای پپرونی 🍕
          </div>
        </div>


        <!-- مخصوص -->
        <div class="pizza-card">
          <img
            src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80"
            alt="پیتزای مخصوص"
          >

          <div class="pizza-name">
            پیتزای مخصوص 👑
          </div>
        </div>


        <!-- بیکن -->
        <div class="pizza-card">
          <img
            src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=700&q=80"
            alt="پیتزای بیکن"
          >

          <div class="pizza-name">
            پیتزای بیکن 🥓
          </div>
        </div>


        <!-- سبزیجات -->
        <div class="pizza-card">
          <img
            src="https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?auto=format&fit=crop&w=700&q=80"
            alt="پیتزای سبزیجات"
          >

          <div class="pizza-name">
            پیتزای سبزیجات 🫑
          </div>
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       صفحه نهایی
  ========================== -->

  <section id="jokePage">

    <div class="joke-card">

      <div class="joke-emoji">
        😂🍕❤️
      </div>

      <h2>
        فقط یه شوخی بود!
      </h2>

      <p>
        دوستت دارم بابا ❤️
      </p>

    </div>

  </section>


  <script>

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    const questionPage = document.getElementById("questionPage");
    const menuPage = document.getElementById("menuPage");
    const jokePage = document.getElementById("jokePage");


    /* =========================
       فرار کردن دکمه نه
    ========================== */

    function moveNoButton() {

      const padding = 15;

      const buttonWidth = noBtn.offsetWidth;
      const buttonHeight = noBtn.offsetHeight;

      const maxX = window.innerWidth - buttonWidth - padding;
      const maxY = window.innerHeight - buttonHeight - padding;

      const randomX =
        padding + Math.random() * Math.max(0, maxX - padding);

      const randomY =
        padding + Math.random() * Math.max(0, maxY - padding);

      noBtn.style.position = "fixed";
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
      noBtn.style.right = "auto";
    }


    /* دسکتاپ */
    noBtn.addEventListener("mouseenter", moveNoButton);


    /* موبایل */
    noBtn.addEventListener(
      "touchstart",
      function (event) {
        event.preventDefault();
        moveNoButton();
      },
      { passive: false }
    );


    /* اگر somehow کلیک شد */
    noBtn.addEventListener("click", function (event) {
      event.preventDefault();
      moveNoButton();
    });


    /* =========================
       آره → منوی پیتزا
    ========================== */

    yesBtn.addEventListener("click", function () {

      questionPage.style.display = "none";
      menuPage.style.display = "block";

      document.body.style.overflow = "auto";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });


    /* =========================
       انتخاب پیتزا → شوخی
    ========================== */

    document.querySelectorAll(".pizza-card").forEach(function (card) {

      card.addEventListener("click", function () {

        menuPage.style.display = "none";
        jokePage.style.display = "flex";

        document.body.style.overflow = "hidden";

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      });

    });

  </script>

</body>
</html>
